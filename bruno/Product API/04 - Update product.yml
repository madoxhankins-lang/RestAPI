info:
  name: Update product
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "price": 1199.99
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("updates the product price", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().price).to.equal(1199.99);
        });

settings:
  encodeUrl: true
